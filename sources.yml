# edu-radar: daftar sumber.
# type: rss | page. Semua sumber dicek tiap run (15 menit, dipicu cron-job.org). every: menit (opsional) hanya untuk sumber yang sengaja dijarangkan.
# channel: resmi | berita | sistem (nama webhook Discord).
# page mode: text (default, bandingkan baris teks) | links (bandingkan daftar tautan).
# ignore_regex: buang baris dinamis (hitungan, tanggal hari ini) agar tidak false alarm.

filters:
  # Satu aturan untuk semua berita (edu dan strict sama): khusus SMA sederajat dan seputar masuk PTN.
  # Lolos kalau: tidak kena exclude, DAN (kena core ATAU (kena topic DAN kena anchor)).
  # Teks yang dicek: judul + deskripsi + slug URL (host tidak ikut).
  edu: &masuk_ptn
    # core: kata inti yang jelas soal masuk PTN. Cukup satu untuk lolos.
    core:
      - '\bsnpmb\b'
      - '\butbk\b'
      - '\bsnbt\b'
      - '\bsnbp\b'
      - 'kip[- ]kuliah'
      - '\bptkin\b'
      - 'span[- ]?ptkin'
      - 'um[- ]?ptkin'
      - 'seleksi mandiri'
      - 'jalur mandiri'
      - 'mandiri ptn'
      - '\bpdss\b'
      - 'penerimaan mahasiswa baru'
      - 'seleksi nasional berbasis'
      - 'ujian tulis berbasis komputer'
      - 'tes kemampuan akademik'
      - 'sekolah kedinasan'
      - 'seleksi masuk (ptn|perguruan tinggi)'
      - 'masuk (ptn|perguruan tinggi)'
      - 'kuliah di ptn'
    # topic: kata ambigu. Harus ditemani salah satu anchor.
    topic:
      - '\bptn\b'
      - '\bptnbh\b'
      - 'perguruan tinggi negeri'
      - '\bukt\b'
      - 'uang kuliah tunggal'
      - '\bmaba\b'
      - 'mahasiswa baru'
      - 'beasiswa'
      - '\btka\b'
      - 'kuliah gratis'
      - 'penjurusan'
      - 'sisdiknas'
      - 'daya tampung'
      - 'jalur prestasi'
      - 'jalur undangan'
    # anchor: penanda tingkat SMA dan proses masuk. "sekolah", "siswa", "mahasiswa", "resmi" sengaja tidak ada (terlalu umum).
    anchor:
      - '\bsma\b'
      - '\bsmk\b'
      - '\bsederajat\b'
      - 'kelas 12'
      - 'kelas xii'
      - 'lulusan sma'
      - 'calon mahasiswa'
      - 'peserta didik'
      - 'pendaftaran'
      - 'penerimaan'
      - 'seleksi'
      - 'kuota'
      - 'jalur'
      - 'registrasi'
    exclude:
      - 'contoh soal'
      - 'latihan soal'
      - 'bank soal'
      - 'kisi[- ]kisi'
      - 'kunci jawaban'
      - 'prediksi soal'
      - 'try ?out'
      - 'bimbel'
      - 'bank mandiri'
      - '\bcpns\b'
      - '\bpppk\b'
      - 'lowongan'
      - 'gibran'
      - 'pemakzulan'
      - '\bptun\b'
      - 'suket'
      - 'hak menyatakan pendapat'
      - 'penyadapan'
      - 'timnas'
  strict: *masuk_ptn

